// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

tasks.register('fetchPipelines') {
    doLast {
        println "🔄 Fetching limelight pipelines from github..."

        def orientationUrl = 'https://raw.githubusercontent.com/nadegelemperiere-robotics/limelight-pipelines/refs/heads/feat-first-version/pipelines/sample-orientation-pipeline.py'
        def outputFile = file('src/main/java/org/firstinspires/ftc/intothedeep/v1/configuration/LimelightPipelinesCode.java')

        def detectionLabelsUrl = 'https://raw.githubusercontent.com/nadegelemperiere-robotics/limelight-pipelines/refs/heads/feat-first-version/models/samples-detection-labels.txt'
        def detectionLabelsFile = file('src/main/resources/data/labels.txt');
        def detectionModelUrl = 'https://raw.githubusercontent.com/nadegelemperiere-robotics/limelight-pipelines/refs/heads/feat-first-version/models/samples-detection-network.tflite'
        def detectionModelFile = file('src/main/resources/data/model.tflite');

        def orientation = new URL(orientationUrl).text
        def orientation_escaped = groovy.json.StringEscapeUtils.escapeJava(orientation)

        println "📥 Downloading model..."
        def conn = new URL(detectionModelUrl).openConnection()
        def modelBytes = conn.inputStream.bytes
        detectionModelFile.parentFile.mkdirs()
        detectionModelFile.bytes = modelBytes

        conn = new URL(detectionLabelsUrl).openConnection()
        modelBytes = conn.inputStream.bytes
        detectionLabelsFile.parentFile.mkdirs()
        detectionLabelsFile.bytes = modelBytes

        def classContent = """
package org.firstinspires.ftc.intothedeep.v1.configuration;

public class LimelightPipelinesCode {
    public static final String sOrientationCode = "${orientation_escaped}";
    public static final String sLabelsPath = "data/labels.txt";
    public static final String sModelPath = "data/model.tflite";

}
        """
        outputFile.text = classContent
    }
}

android {
    namespace = 'org.firstinspires.ftc.intothedeep'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    sourceSets {
        main.java.srcDirs += file('../core/src/test/java/org/firstinspires/ftc/core/')
        main.java.srcDirs += file('../core/src/tuning/java/org/firstinspires/ftc/core/')
        main.java.srcDirs += file('./src/test/java/org/firstinspires/ftc/intothedeep/v1/')
    }
}

repositories {
    maven { url = "https://maven.pedropathing.com/" }
    maven { url = 'https://maven.brott.dev/' }
    maven { url = 'https://repo.dairy.foundation/releases' }
    maven { url = 'https://www.matthewo.tech/maven/' }
}


dependencies {
    implementation project(':FtcRobotController')
    implementation project(':core')

    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7.1'
    implementation "com.acmerobotics.roadrunner:ftc:0.1.20"
    implementation "com.acmerobotics.roadrunner:core:1.0.1"
    implementation "com.acmerobotics.roadrunner:actions:1.0.1"
    implementation "com.pedropathing:pedro:1.0.8"
    implementation "com.acmerobotics.dashboard:dashboard:0.4.16"
    implementation 'org.team11260:fast-load:0.1.2'
    implementation 'org.json:json:20250107'

}